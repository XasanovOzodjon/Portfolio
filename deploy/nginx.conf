server {
    listen 80;
    server_name khasanoff.uz www.khasanoff.uz 13.51.157.116;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name khasanoff.uz www.khasanoff.uz 13.51.157.116;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/khasanoff.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khasanoff.uz/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/portfolio_access.log;
    error_log /var/log/nginx/portfolio_error.log;

    # Max upload size
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /home/ubuntu/app/portfolio/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/app/portfolio/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location /favicon.ico {
        alias /home/ubuntu/app/portfolio/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Django application
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/app/portfolio/portfolio.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
