# HTTP → HTTPS redirect (www va non-www)
server {
    listen 80;
    server_name khasanoff.uz www.khasanoff.uz;
    return 301 https://khasanoff.uz$request_uri;
}

# www HTTPS → non-www HTTPS (asosiy manzil)
server {
    listen 443 ssl;
    server_name www.khasanoff.uz;

    ssl_certificate /etc/letsencrypt/live/khasanoff.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khasanoff.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://khasanoff.uz$request_uri;
}

# Asosiy server — https://khasanoff.uz
server {
    listen 443 ssl;
    server_name khasanoff.uz 13.51.157.116;

    ssl_certificate /etc/letsencrypt/live/khasanoff.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khasanoff.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/portfolio_access.log;
    error_log /var/log/nginx/portfolio_error.log;

    # Max upload size
    client_max_body_size 10M;

    # Static files
    location /static/ {
        alias /home/ubuntu/app/portfolio/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /home/ubuntu/app/portfolio/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location /favicon.ico {
        alias /home/ubuntu/app/portfolio/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Django application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
