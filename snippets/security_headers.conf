# ==============================================================================
# Centralized Security Headers Snippet for NGINX
# Included in server block and all location blocks that override add_header
# ==============================================================================

# Clickjacking Protection
add_header X-Frame-Options "DENY" always;

# MIME-sniffing Prevention
add_header X-Content-Type-Options "nosniff" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Feature & Permissions Policy
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy (CSP)
# Dastlab sayt komponentlari (Tailwind CDN, Google Fonts, ESM OGL va Unsplash) to'liq
# ishlashini tekshirish uchun Report-Only rejimida yoqiladi.
# Tekshiruvdan so'ng 'Content-Security-Policy-Report-Only' ni 'Content-Security-Policy' ga o'zgartiring.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' data: blob:; connect-src 'self' https://esm.sh; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
