<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="5" y="5" width="118" height="118" rx="24" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.2"/>

  <rect x="18" y="26" width="92" height="76" rx="12" fill="#050505" stroke="#374151" stroke-width="1.5"/>
  <rect x="18" y="26" width="92" height="22" rx="12" fill="#111827"/>
  <rect x="18" y="36" width="92" height="12" fill="#111827"/>
  <line x1="18" y1="48" x2="110" y2="48" stroke="#1f2937" stroke-width="1"/>

  <circle cx="32" cy="37" r="4.5" fill="#ef4444"/>
  <circle cx="46" cy="37" r="4.5" fill="#eab308"/>
  <circle cx="60" cy="37" r="4.5" fill="#22c55e"/>

  <g filter="url(#glow)">
    <text x="30" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#accent)">&gt;</text>
    <rect x="50" y="62" width="4" height="26" rx="1.5" fill="#22c55e"/>
  </g>

  <text x="68" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" fill="#6b7280" opacity="0.9">_</text>
</svg>
