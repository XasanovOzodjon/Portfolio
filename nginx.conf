# ==============================================================================
# NGINX High-Performance Production Configuration for khasanoff.uz (portfolio-v2)
# Features: HTTP/2, SSL, Gzip/Brotli, WebP content negotiation, 1-year immutable caching
# ==============================================================================

# Map for WebP content negotiation
map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name khasanoff.uz www.khasanoff.uz;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://khasanoff.uz$request_uri;
    }
}

# www HTTPS -> non-www HTTPS canonical redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.khasanoff.uz;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/khasanoff.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khasanoff.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://khasanoff.uz$request_uri;
}

# Main Production Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name khasanoff.uz;
    server_tokens off;

    # SSL Configuration & Modern Ciphers
    ssl_certificate /etc/letsencrypt/live/khasanoff.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/khasanoff.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Base Security Headers (Inherited unless a location defines add_header)
    include /home/ubuntu/app/portfolio/portfolio-v2/snippets/security_headers.conf;

    # Logging
    access_log /var/log/nginx/portfolio_access.log combined buffer=64k flush=5m;
    error_log /var/log/nginx/portfolio_error.log warn;

    client_max_body_size 16M;

    # GZIP Compression Engine
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Direct access for static assets referenced without /static/ prefix
    location ^~ /assets/ {
        alias /home/ubuntu/app/portfolio/portfolio-v2/static/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    location ^~ "/Landing Page Assest/" {
        alias "/home/ubuntu/app/portfolio/portfolio-v2/static/Landing Page Assest/";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    location ^~ "/Project Images/" {
        alias "/home/ubuntu/app/portfolio/portfolio-v2/static/Project Images/";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
    }

    # Root-level static scripts, stylesheets, and assets (e.g. /FlexCarousel.css, /flex-carousel.js, /sw.js)
    location ~* \.(?:js|mjs|css|png|jpe?g|webp|svg|gif|ico|woff2?|ttf|eot|mp4|webm|glb|gltf|json)$ {
        root /home/ubuntu/app/portfolio/portfolio-v2/static;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Static Assets — 1-Year Immutable Caching (Max Performance)
    location /static/ {
        alias /home/ubuntu/app/portfolio/portfolio-v2/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /home/ubuntu/app/portfolio/portfolio-v2/snippets/security_headers.conf;
        access_log off;
        log_not_found off;
        tcp_nodelay off;
        open_file_cache max=3000 inactive=120s;
        open_file_cache_valid 45s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;

        # WebP Transparent Content Negotiation
        # Serves .webp if supported and file exists, otherwise serves original
        location ~* ^/static/(.+)\.(png|jpe?g)$ {
            add_header Vary Accept;
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /home/ubuntu/app/portfolio/portfolio-v2/snippets/security_headers.conf;
            try_files $uri$webp_suffix $uri =404;
        }
    }

    # Uploaded Media Files — 1-Year Caching
    location /media/ {
        alias /home/ubuntu/app/portfolio/portfolio-v2/media/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000";
        include /home/ubuntu/app/portfolio/portfolio-v2/snippets/security_headers.conf;
        access_log off;
        log_not_found off;
    }

    # Favicon & Robots
    location = /favicon.ico {
        alias /home/ubuntu/app/portfolio/portfolio-v2/static/assets/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /robots.txt {
        alias /home/ubuntu/app/portfolio/portfolio-v2/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Dynamic Django Application — Micro-caching / No-cache for HTML Updates
    location / {
        proxy_pass http://127.0.0.1:8009;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Immediate propagation of HTML updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /home/ubuntu/app/portfolio/portfolio-v2/snippets/security_headers.conf;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
